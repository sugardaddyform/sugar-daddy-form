<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Daddy Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sugar Daddy Form</h1>
        <form id="sugarForm">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="age">Age *</label>
                <input type="number" id="age" name="age" min="18" required>
            </div>

            <div class="form-group">
                <label for="country">Country *</label>
                <input type="text" id="country" name="country" required>
            </div>

            <div class="form-group">
                <label for="work">Work *</label>
                <input type="text" id="work" name="work" required>
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <textarea id="address" name="address" required></textarea>
            </div>

            <div class="form-group">
                <label for="paypal">PayPal Email *</label>
                <input type="email" id="paypal" name="paypal" required>
            </div>

            <div class="form-group">
                <label for="arrangement">What kind of arrangement are you interested in? *</label>
                <textarea id="arrangement" name="arrangement" required></textarea>
            </div>

            <div class="form-group">
                <label for="expectations">Your expectations and boundaries *</label>
                <textarea id="expectations" name="expectations" required></textarea>
            </div>

            <div class="form-group">
                <label for="additional">Anything else you'd like to share?</label>
                <textarea id="additional" name="additional"></textarea>
            </div>

            <button type="submit">Sign</button>

            <div class="success-message" id="successMessage">
                ✓ Form submitted successfully!
            </div>
        </form>
    </div>

    <script>
        document.getElementById('sugarForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form data
            const formData = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                country: document.getElementById('country').value,
                work: document.getElementById('work').value,
                address: document.getElementById('address').value,
                paypal: document.getElementById('paypal').value,
                arrangement: document.getElementById('arrangement').value,
                expectations: document.getElementById('expectations').value,
                additional: document.getElementById('additional').value,
                timestamp: new Date().toISOString()
            };

            // Log to console (you can replace this with an API call)
            console.log('Form Data:', formData);

            // Show success message
            document.getElementById('successMessage').style.display = 'block';

            // Reset form
            this.reset();

            // Hide success message after 3 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
