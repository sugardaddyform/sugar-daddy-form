<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Daddy Money Request Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 20px;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        .logo-text {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 22px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .amount-currency-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .radio-option label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .two-column {
                grid-template-columns: 1fr;
            }

            .amount-currency-group {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <span class="logo-icon">💎</span>
            <h2 class="logo-text">Sugar Daddy</h2>
        </div>
        
        <h1>Money Request Form</h1>
        
        <form id="sugarForm" action="https://formspree.io/f/myeyqdby" method="POST">
            <!-- Personal Information Section -->
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="two-column">
                <div class="form-group">
                    <label for="age">Age *</label>
                    <input type="number" id="age" name="age" min="18" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <div class="two-column">
                <div class="form-group">
                    <label for="country">Country *</label>
                    <input type="text" id="country" name="country" required>
                </div>

                <div class="form-group">
                    <label for="work">Work/Occupation *</label>
                    <input type="text" id="work" name="work" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <textarea id="address" name="address" required></textarea>
            </div>

            <div class="form-group">
                <label for="paypal">PayPal Email *</label>
                <input type="email" id="paypal" name="paypal" required>
            </div>

            <!-- Money Request Section with Currency -->
            <div class="form-group">
                <label>Money Request Amount *</label>
                <div class="amount-currency-group">
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="number" id="amount" name="amount" min="0" step="0.01" placeholder="Enter amount (e.g., 500)" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <select id="currency" name="currency" required>
                            <option value="">Select Currency</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="JPY">JPY - Japanese Yen</option>
                            <option value="AUD">AUD - Australian Dollar</option>
                            <option value="CAD">CAD - Canadian Dollar</option>
                            <option value="CHF">CHF - Swiss Franc</option>
                            <option value="CNY">CNY - Chinese Yuan</option>
                            <option value="INR">INR - Indian Rupee</option>
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="NGN">NGN - Nigerian Naira</option>
                            <option value="KES">KES - Kenyan Shilling</option>
                            <option value="ZAR">ZAR - South African Rand</option>
                            <option value="MXN">MXN - Mexican Peso</option>
                            <option value="BRL">BRL - Brazilian Real</option>
                            <option value="PHP">PHP - Philippine Peso</option>
                            <option value="THB">THB - Thai Baht</option>
                            <option value="MYR">MYR - Malaysian Ringgit</option>
                            <option value="SGD">SGD - Singapore Dollar</option>
                            <option value="HKD">HKD - Hong Kong Dollar</option>
                            <option value="NOK">NOK - Norwegian Krone</option>
                            <option value="SEK">SEK - Swedish Krona</option>
                            <option value="DKK">DKK - Danish Krone</option>
                            <option value="NZD">NZD - New Zealand Dollar</option>
                            <option value="ZWL">ZWL - Zimbabwean Dollar</option>
                            <option value="PKR">PKR - Pakistani Rupee</option>
                            <option value="BDT">BDT - Bangladeshi Taka</option>
                            <option value="VND">VND - Vietnamese Dong</option>
                            <option value="IDR">IDR - Indonesian Rupiah</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="purpose">What do you want the money for? *</label>
                <textarea id="purpose" name="purpose" placeholder="Explain in detail what you need the money for" required></textarea>
            </div>

            <!-- Trust Question -->
            <div class="form-group">
                <label>Are you going to run with the money after receiving it? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="run_no" name="run_with_money" value="No" required>
                        <label for="run_no">No</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="run_yes" name="run_with_money" value="Yes" required>
                        <label for="run_yes">Yes</label>
                    </div>
                </div>
            </div>

            <!-- Arrangement Details -->
            <div class="form-group">
                <label for="arrangement">What kind of arrangement are you interested in? *</label>
                <textarea id="arrangement" name="arrangement" required></textarea>
            </div>

            <div class="form-group">
                <label for="expectations">Your expectations and boundaries *</label>
                <textarea id="expectations" name="expectations" required></textarea>
            </div>

            <div class="form-group">
                <label for="additional">Anything else you'd like to share?</label>
                <textarea id="additional" name="additional"></textarea>
            </div>

            <button type="submit">Submit Request</button>

            <div class="success-message" id="successMessage">
                ✓ Form submitted successfully! Check your email.
            </div>

            <div class="error-message" id="errorMessage">
                ✗ Error submitting form. Please try again.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('sugarForm').addEventListener('submit', function(e) {
            // Form will submit with POST method to Formspree
            // No need to prevent default - let it submit naturally
        });
    </script>
</body>
</html>
